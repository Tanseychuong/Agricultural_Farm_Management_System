{% extends 'farm/base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-5">
        <h1 class="h4 mb-3">Log in</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-success" type="submit">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
