<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Farm Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">Farm Management</a>
            {% if user.is_authenticated %}
            <div class="navbar-nav flex-row flex-wrap gap-3 me-auto ms-4">
                <a class="nav-link text-white-50" href="{% url 'farm-list' %}">Farms</a>
                <a class="nav-link text-white-50" href="{% url 'crop-list' %}">Crops</a>
                <a class="nav-link text-white-50" href="{% url 'crop-worker-list' %}">Crop Workers</a>
                <a class="nav-link text-white-50" href="{% url 'worker-equipment-list' %}">Equipment</a>
                <a class="nav-link text-white-50" href="{% url 'crop-fertilizer-list' %}">Fertilizer Usage</a>
                <a class="nav-link text-white-50" href="{% url 'harvest-sale-list' %}">Sale Line Items</a>
                <a class="nav-link text-white-50" href="{% url 'crop-list' %}">Crops</a>
                <a class="nav-link text-white-50" href="{% url 'worker-list' %}">Workers</a>
            </div>
            <span class="text-white me-3">{{ user.username }}</span>
            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
            </form>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
