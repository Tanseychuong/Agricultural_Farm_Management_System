{% extends 'farm/base.html' %}
{% block title %}Record Fertilizer Usage{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Record Fertilizer Usage</h1>
<div class="card"><div class="card-body">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Save Usage</button>
            <a href="{% url 'crop-fertilizer-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div></div>
{% endblock %}
