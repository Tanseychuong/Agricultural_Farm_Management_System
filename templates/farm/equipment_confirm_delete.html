{% extends 'farm/base.html' %}
{% block title %}Delete Equipment{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Delete Equipment</h1>
<div class="card"><div class="card-body">
    <p>Delete <strong>{{ object.equipment_name }}</strong>?</p>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'equipment-list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div></div>
{% endblock %}
