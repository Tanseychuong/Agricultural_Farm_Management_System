{% extends 'farm/base.html' %}
{% block title %}Record Sale Line Item{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Record Sale Line Item</h1>
<div class="card"><div class="card-body">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Save Line Item</button>
            <a href="{% url 'harvest-sale-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div></div>
{% endblock %}
