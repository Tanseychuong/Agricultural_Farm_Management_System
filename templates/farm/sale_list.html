{% extends 'farm/base.html' %}
{% block title %}Sales{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div><h1 class="h3 mb-0">Sales</h1></div>
    <a href="{% url 'sale-create' %}" class="btn btn-primary">New Sale</a>
</div>
<div class="card"><div class="card-body p-0">
    <table class="table table-hover mb-0">
        <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="text-end">Total</th></tr></thead>
        <tbody>
        {% for s in sales %}
            <tr>
                <td><a href="{% url 'sale-detail' s.sale_id %}">{{ s.invoice_number }}</a></td>
                <td>{{ s.customer }}</td>
                <td>{{ s.sale_date }}</td>
                <td class="text-end">{{ s.total_amount }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="4" class="text-muted text-center py-4">No sales recorded yet.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div></div>
{% endblock %}
