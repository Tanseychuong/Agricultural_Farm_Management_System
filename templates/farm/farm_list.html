{% extends 'farm/base.html' %}

{% block title %}Farms{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">Farms</h1>
        <p class="text-muted mb-0">Manage registered farms.</p>
    </div>

    <a href="/admin/farm/farm/add/" class="btn btn-primary">
        Add Farm
    </a>
</div>

<div class="card">
    <div class="card-body p-0">

        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Farm</th>
                    <th>Location</th>
                    <th>Total Size</th>
                </tr>
            </thead>

            <tbody>
                {% for farm in farms %}
                <tr>
                    <td>{{ farm.farm_name }}</td>
                    <td>{{ farm.location }}</td>
                    <td>{{ farm.total_size }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-muted text-center py-4">
                        No farms found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</div>

{% endblock %}
