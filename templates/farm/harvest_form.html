{% extends 'farm/base.html' %}
{% block title %}{% if form.instance.pk %}Edit Harvest{% else %}Record Harvest{% endif %}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{% if form.instance.pk %}Edit Harvest{% else %}Record Harvest{% endif %}</h1>
<div class="card"><div class="card-body">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Save Harvest</button>
            <a href="{% url 'harvest-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div></div>
{% endblock %}
